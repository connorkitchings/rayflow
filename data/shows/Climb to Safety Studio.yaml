vibe:
  palette:
    name: Southern Rock Amber Lavender
    colors:
    - Warm Amber
    - '#FFB347'
    - '#8A5CFF'
    - '#2146D0'
    - '#B22222'
    - White
    description: 'Warm amber and gold as the base, with lavender/blue backlight contrast
      and deep red for the final lift.

      '
  intensity_curve: medium groove to open chorus to bridge build to final peak
  movement_style: restrained slow sweeps locked to the groove
  beam_style: minimal aerials, narrow texture only at peaks
  mood_keywords:
  - southern-rock
  - warm
  - organic
  - groove
  - slow-sweep
  description: 'First real RayFlow pilot for Widespread Panic''s studio/album version
    of "Climb to Safety". The design should prioritize band visibility, warm natural
    front light, lavender/blue backlight contrast, and slow Hoffman-style color evolution
    over flashy beam effects.

    '
