presets:
  front_warm:
    name: "Front Warm"
    description: "Natural warm front light for the band."
    attributes: {dimmer: "60", color: "Warm Amber"}
    channels: "1 Thru 6"
    tags: ["front", "warm", "panic"]
  back_lavender:
    name: "Back Lavender"
    description: "Cool lavender/blue backlight contrast."
    attributes: {dimmer: "65", color: "#6B5CFF"}
    channels: "7 Thru 10"
    tags: ["back", "cool", "contrast"]
  blade_texture:
    name: "Blade Texture"
    description: "Restrained gobo texture from the profile fixtures."
    attributes: {dimmer: "55", gobo: "45", beam: "narrow", focus: "55"}
    channels: "11 Thru 14"
    tags: ["texture", "gobo", "profile"]
  full_warm_blue:
    name: "Full Warm Blue"
    description: "Warm front and cool back full-stage song look."
    attributes: {dimmer: "75", color: "#FFB347"}
    channels: "1 Thru 14"
    tags: ["full", "warm", "blue"]
  blackout:
    name: "Blackout"
    description: "All fixtures out."
    attributes: {dimmer: "0"}
    channels: "1 Thru 14"
    tags: ["blackout"]
notes: >
  Pilot rig uses only checked-in fixture profiles for reproducible offline
  workflow validation. It intentionally favors warm front visibility,
  lavender/blue backlight, restrained movement, and MMX texture for a
  Paul Hoffman / Widespread Panic-inspired Southern rock look.
