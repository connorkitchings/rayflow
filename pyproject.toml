[project]
name = "rayflow"
version = "0.1.0"
description = "AI-assisted concert lighting design toolkit with backend-neutral show data, DMX rendering, and console adapters."
authors = [{ name = "Connor Kitchings", email = "connor.kitchings@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "requests>=2.31.0",
]

[project.scripts]
rayflow = "rayflow.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.0",
]

lighting = [
    "stupidArtnet>=1.6.0",
    "sacn>=1.11.0",
    "python-osc>=1.10.0",
    "pygdtf>=1.4.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "websocket-client>=1.8.0",
]

visualizer = [
    "flask>=3.0.0",
    "websocket-server>=0.6.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=src/rayflow",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=35",
    "-v",
]
markers = [
    "integration: requires a running grandMA3 onPC instance (deselected by default)",
]

[tool.coverage.run]
source = ["src/rayflow"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/conftest.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest-cov>=7.0.0",
    "ruff>=0.14.3",
]
