[project]
name = "rayflow"
version = "0.2.0"
description = "AI-assisted song lighting for grandMA3: generates plugins and timecode from a rig, a song and a design."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[dependency-groups]
dev = ["ruff>=0.14.3"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
